<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鱼Sho 连接器</title>
<style>
:root { --text: #141A33; --text2: #4B5472; --text3: #8A91A8; --bg: #F4F6FB; --card: #FFFFFF; --line: #E3E7F0; --brand: #3B5BEB; --brand-soft: #EAF0FF; --danger: #D1242F; --ok: #1E9A52; color-scheme: light dark; }
@media (prefers-color-scheme: dark) { :root { --text: #E8EBF5; --text2: #AEB5CC; --text3: #7A819A; --bg: #0F1220; --card: #181C2E; --line: #2A3048; --brand: #6E8BFF; --brand-soft: #1E2645; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif; }
main { max-width: 720px; margin: 0 auto; padding: 36px 20px 60px; }
header { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
header h1 { font-size: 22px; margin: 0; }
.fish { color: var(--brand); display: inline-flex; }
.sub { color: var(--text2); margin: 0 0 22px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px; margin-bottom: 14px; }
.card h2 { font-size: 16px; margin: 0 0 12px; }
.pair { display: grid; grid-template-columns: 232px 1fr; gap: 26px; align-items: center; }
.qr { width: 232px; height: 232px; background: #fff; border-radius: 14px; padding: 10px; }
.qr svg { width: 100%; height: 100%; display: block; }
ol { margin: 8px 0 0; padding-left: 20px; color: var(--text2); } li { margin: 3px 0; }
.code { font: 600 30px/1.2 ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: .14em; margin: 4px 0 6px; }
.muted { color: var(--text3); font-size: 13px; }
.ask { border: 2px solid var(--brand); }
.fp { font: 600 24px/1.3 ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: .06em; margin: 6px 0 12px; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }
button { font: inherit; border-radius: 10px; padding: 9px 18px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
button.pri { background: var(--brand); border-color: transparent; color: #fff; font-weight: 600; }
button.bad { color: var(--danger); }
button.link { border: 0; background: none; padding: 2px 4px; color: var(--brand); }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
.row:first-of-type { border-top: 0; padding-top: 0; }
.row .t { flex: 1; min-width: 0; } .row small { color: var(--text3); display: block; word-break: break-all; }
.kv { display: grid; grid-template-columns: 92px 1fr; gap: 6px 14px; font-size: 14px; } .kv .k { color: var(--text3); } .kv .v { word-break: break-all; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; margin-right: 6px; } .dot.off { background: var(--text3); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.switch { position: relative; width: 46px; height: 28px; flex: none; border-radius: 14px; padding: 0; border: 0; background: var(--line); }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch[aria-checked="true"] { background: var(--brand); } .switch[aria-checked="true"]::after { left: 21px; }
.err { color: var(--danger); margin: 10px 0 0; }
.warn { background: var(--brand-soft); border-radius: 10px; padding: 10px 12px; color: var(--text2); font-size: 13px; margin-top: 10px; }
@media (max-width: 620px) { .pair { grid-template-columns: 1fr; } .qr { margin: 0 auto; } }
@media (prefers-reduced-motion: reduce) { .switch::after { transition: none; } }
</style>
</head>
<body>
<main id="app"><p class="muted">加载中…</p></main>
<script>
const AG = { codex: 'Codex', claude: 'Claude Code', dsh: 'DSH' }
const FISH = '<svg width="30" height="18" viewBox="0 0 24 14" fill="currentColor" aria-hidden="true"><path d="M1 7c3-5.2 10-6.2 15-1l6-4.5v11L16 8c-5 5.2-12 4.2-15-1z"/><circle cx="6.5" cy="6" r="1.2" fill="var(--card)"/></svg>'
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
const left = (ms) => { const s = Math.max(0, Math.round((ms - Date.now()) / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') }
const app = document.getElementById('app')
let last = '', d = null, err = '', busy = false, arm = null, gone = false

async function api(name, body) {
  const r = await fetch('/api/' + name, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : {})
  if (r.status === 401) { location.reload(); throw new Error('链接过期') }
  const j = await r.json(); if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status); return j
}
async function load() { if (gone) return; try { d = await api('status') } catch (e) { if (!d) err = '连不上连接器：' + e.message } render() }
async function act(name, body = {}) { busy = true; err = ''; render(); try { await api(name, body) } catch (e) { err = e.message } busy = false; await load() }

function render() {
  if (gone) { app.innerHTML = `<header><span class="fish">${FISH}</span><h1>鱼Sho 连接器已停止</h1></header><p class="sub">手机暂时连不上这台电脑。想再开，重新运行 <b>yusho-connect</b>，或让你的 Agent 运行。</p>`; return }
  if (!d) { app.innerHTML = `<p class="${err ? 'err' : 'muted'}">${esc(err || '加载中…')}</p>`; return }
  const p = d.pairing, live = d.devices.filter((x) => !x.revoked), ag = d.agents.map((a) => AG[a] ?? a)
  let h = `<header><span class="fish">${FISH}</span><h1>鱼Sho 连接器</h1></header>
  <p class="sub">让手机上的鱼Sho 直接和这台电脑上的 ${esc(ag.join('、') || 'Agent')} 说话、派活。消息端到端加密；只听连上的手机，只在工作目录里干活，不碰你的账号。</p>`
  if (p?.request) {
    h += `<section class="card ask" aria-live="polite"><h2>「${esc(p.request.label)}」想连上这台电脑${p.request.number ? '（鱼Sho号 ' + esc(p.request.number) + '）' : ''}</h2>
    <div>手机的指纹：</div><div class="fp">${esc(p.request.fingerprint)}</div>
    <p class="muted">和手机屏幕上显示的指纹一样，才点确认。不一样说明不是你的手机，点取消。</p>
    <div class="btns"><button class="pri" data-act="answer" data-ok="1" ${busy ? 'disabled' : ''}>一样，确认连接</button><button data-act="answer" data-ok="0" ${busy ? 'disabled' : ''}>不一样，取消</button></div></section>`
  } else if (p) {
    h += `<section class="card"><h2>${p.restore ? '把旧手机的身份交给新手机' : '用手机扫这个二维码'}</h2><div class="pair">
      <div class="qr" role="img" aria-label="连接二维码">${d.qrSvg ?? ''}</div>
      <div><ol><li>打开鱼Sho → 圈子 → 右上角“+” → 接入电脑上的 Agent</li><li>${p.restore ? '点“从电脑找回原来的身份”，再点“扫一扫”' : '点“扫一扫”，对准左边的二维码'}</li><li>这里会出现手机的指纹，核对一样就确认</li></ol>
      <div style="margin-top:14px">扫不了就输入连接码：</div><div class="code">${esc(p.code.slice(0, 3) + ' ' + p.code.slice(3))}</div>
      <div class="muted">还剩 <span id="left">${left(p.expires)}</span> 有效 · <button class="link" data-act="cancel">不连了</button></div></div></div></section>`
  } else {
    h += `<section class="card"><h2>${live.length ? '再连一部手机' : '还没有连上手机'}</h2><p class="muted" style="margin-top:0">点下面的按钮，用手机扫出现的二维码。</p>
    <button class="pri" data-act="pair" ${busy || !d.number ? 'disabled' : ''}>连接手机</button>${!d.number ? '<p class="err">这台电脑还没领到鱼Sho号（要联网），领到才能连。</p>' : ''}</section>`
  }
  h += `<section class="card"><h2>连着的手机</h2>${live.length ? live.map((x) => `<div class="row"><div class="t"><b>${esc(x.label)}</b><small>指纹 ${esc(x.fingerprint)}${x.number ? ' · 鱼Sho号 ' + esc(x.number) : ''} · ${new Date(x.added).toLocaleDateString('zh-CN')} 连上</small></div><button class="bad" data-act="remove" data-pk="${esc(x.pk)}">${arm === x.pk ? '确认断开' : '断开'}</button></div>`).join('') : '<p class="muted" style="margin:0">还没有</p>'}</section>`
  if (d.backups.length) h += `<section class="card"><h2>换手机恢复</h2><p class="muted" style="margin-top:0">手机重装或换了新手机：选原来那部，把它的身份交给新手机（新手机上点“从电脑找回原来的身份”）。</p>${d.backups.map((b) => `<div class="row"><div class="t"><b>${esc(b.label)}</b><small>指纹 ${esc(b.fingerprint)} · 备份于 ${new Date(b.at).toLocaleString('zh-CN', { hour12: false })}</small></div><button data-act="restore" data-pk="${esc(b.pk)}" ${busy || p ? 'disabled' : ''}>交给新手机</button></div>`).join('')}</section>`
  h += `<section class="card"><div class="toggle"><div><h2 style="margin:0">开机自动运行</h2><div class="muted">开着电脑，手机就随时能找它干活；在后台运行，不弹窗口。</div></div>
    <button class="switch" role="switch" aria-label="开机自动运行" aria-checked="${d.autostart}" data-act="autostart" ${busy ? 'disabled' : ''}></button></div>
    ${d.npxCache && !d.autostart ? '<div class="warn">现在是用 npx 临时运行的，开机自启前最好先装好：<code>npm i -g yusho-connect</code>，再运行 <code>yusho-connect</code>。</div>' : ''}</section>`
  h += `<section class="card"><h2>这台电脑</h2><div class="kv">
    <span class="k">状态</span><span class="v"><span class="dot${d.online ? '' : ' off'}"></span>${d.online ? '在线' : '连不上中继（检查网络）'}</span>
    <span class="k">名字</span><span class="v">${esc(d.name)}</span>
    <span class="k">鱼Sho号</span><span class="v">${esc(d.number ?? '还没领到')}</span>
    <span class="k">指纹</span><span class="v">${esc(d.fingerprint)}</span>
    <span class="k">Agent</span><span class="v">${esc(ag.join('、') || '没找到（先装好并登录 Codex 或 Claude Code）')}</span>
    ${(d.hints ?? []).length ? `<span class="k">还差一步</span><span class="v">${d.hints.map(esc).join('<br>')}</span>` : ''}
    <span class="k">工作目录</span><span class="v">${esc(d.workDir)}</span>
    <span class="k">在做</span><span class="v">${d.tasks.length ? d.tasks.map((t) => esc((AG[t.agent] ?? t.agent) + '：' + t.title + (t.waiting ? '（等手机上批）' : ''))).join('；') : '空闲'}</span></div>
    <div class="btns" style="margin-top:14px"><button class="bad" data-act="quit">${arm === 'quit' ? '确认停止（手机会连不上）' : '停止连接器'}</button></div></section>`
  if (err) h += `<p class="err" role="alert">${esc(err)}</p>`
  if (h !== last) { last = h; app.innerHTML = h } // 内容没变不重画，免得键盘焦点跳走
}
app.addEventListener('click', (e) => {
  const b = e.target.closest('button[data-act]'); if (!b || b.disabled) return
  const a = b.dataset.act
  if (a === 'remove') { if (arm !== b.dataset.pk) { arm = b.dataset.pk; return render() } arm = null; return act('remove', { pk: b.dataset.pk }) }
  if (a === 'quit') { if (arm !== 'quit') { arm = 'quit'; return render() } return api('quit', {}).finally(() => { gone = true; render() }) }
  arm = null
  if (a === 'answer') return act('answer', { ok: b.dataset.ok === '1' })
  if (a === 'restore') return act('restore', { pk: b.dataset.pk })
  if (a === 'autostart') return act('autostart', { on: !d.autostart })
  return act(a)
})
setInterval(() => { const el = document.getElementById('left'); if (el && d?.pairing) el.textContent = left(d.pairing.expires) }, 1000)
setInterval(load, 1500); load()
</script>
</body>
</html>
